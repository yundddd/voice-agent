[package]
name = "neutts_bridge"
version = "0.1.0"
edition = "2021"
description = "C FFI bridge over the neutts crate for the voice-agent Flutter app"
license = "MIT"

[lib]
name = "neutts_bridge"
crate-type = ["cdylib"]

[dependencies]
# On-device NeuTTS inference: GGUF backbone (llama.cpp) + pure-Rust NeuCodec
# decoder + bundled espeak-ng phonemizer.  Decoder weights load at runtime
# (no build-time downloads), so this builds fully offline-capable.
neutts = { version = "0.1.1", default-features = false, features = [
  "backbone",
  "espeak",
  "fast",
] }
# Direct dep (same features neutts uses → same resolved crate, zero extra
# bytes): lets nt_set_espeak_data_path populate that directory from the
# data compiled into this .so before handing it to neutts.
espeak-ng = { version = "0.1", features = ["bundled-data"] }

# Keep llama.cpp static: neutts enables llama-cpp-4's default features
# (dynamic-link/openmp/mtmd) transitively, and feature unification cannot
# subtract them.  The patched shim below re-declares `default = []`, giving
# one self-contained cdylib (no libllama.so.0 / libomp.so NEEDED entries —
# fatal for a pack-distributed .so on older Android).
[patch.crates-io]
llama-cpp-4 = { path = "../llama-cpp-static" }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
