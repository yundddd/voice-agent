name: voice_agent
description: "On-device voice assistant prototype: speech -> text -> speech, fully offline."
publish_to: 'none'
version: 0.1.0+157

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # On-device ASR + TTS (onnxruntime bundled per platform)
  sherpa_onnx: 1.13.8

  # Microphone capture (PCM16 stream)
  record: ^6.0.0

  # WAV playback of synthesized speech
  audioplayers: ^6.0.0

  # Extract the model zip assets at runtime
  archive: ^3.6.1

  # Runtime asset extraction (models copied out of assets to app support dir)
  path_provider: ^2.1.3
  path: ^1.9.0
  # Vendored slim copy of piper_phonemize 1.5.7: espeak-ng data trimmed
  # to English (+Italian, for the two student voices tomorrow) and the 18 MB
  # web WASM bundle dropped — full package ballooned the APK past the
  # Telegram 50 MB cap. Re-sync with upstream by copying a new release
  # over third_party/ and re-applying the prune commands in the README.
  piper_phonemize:
    path: third_party/piper_phonemize
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/silero_vad.onnx