name: voice_agent
description: "On-device voice assistant prototype: speech -> text -> speech, fully offline."
publish_to: 'none'
version: 0.1.0+337

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # On-device ASR + TTS (onnxruntime bundled per platform)
  sherpa_onnx: 1.13.8

  # Microphone capture (PCM16 stream)
  record: ^6.0.0

  # WAV playback of synthesized speech
  audioplayers: ^6.0.0

  # Extract the model zip assets at runtime
  archive: ^3.6.1

  # Runtime asset extraction (models copied out of assets to app support dir)
  path_provider: ^2.1.3
  path: ^1.9.0
  # +292: Google's reference M3 color math (HCT). Transitive today —
  # the Flutter SDK itself runs on it — named explicitly because our
  # palette is now generated with it directly (theme.dart, the
  # session face). Version rides whatever the SDK pins; keep it in
  # step when flutter upgrades.
  material_color_utilities: ^0.13.0
  # (The vendored piper_phonemize fork lived here until the Italian
  # student voices retired: the English students read Kokoro's own
  # lexicon files via lib/speech/lexicon_pronouncer.dart, so the GPL
  # espeak plugin — fork, pruned espeak-ng data and all — left the APK.)
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/silero_vad.onnx
    # +238: the out-of-process student front-end's pruned English data.
    # Flutter directory entries are NOT recursive — they bundle only the
    # files directly inside — so the lang/gmw subtree needs its own
    # entry (the first phone build proved it: 'Unable to load asset
    # assets/espeak-data/lang/gmw/en').
    - assets/espeak-data/
    - assets/espeak-data/lang/gmw/