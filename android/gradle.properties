org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Box has a javac-less java-25 JRE; keep Gradle toolchain detection on the full JDKs.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=/usr/lib/jvm/java-17-openjdk-amd64,/usr/lib/jvm/java-21-openjdk-amd64
# ...and run the daemon itself on a full JDK: when launched from PATH (java-25),
# the *running* JVM is a toolchain candidate too, and plugin javac tasks (e.g.
# audioplayers_android compileDebugJavaWithJavac) then fail on JAVA_COMPILER.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
